<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Serve — Alt</title>
<style>
:root {
  --bg: #0c0e14;
  --bg-elev: #141620;
  --bg-elev-2: #1a1c28;
  --line: #222438;
  --line-hi: #323448;
  --ink: #e8eaf0;
  --ink-dim: #8a8ea8;
  --ink-mute: #5a5e78;
  --accent: #4cc9f0;
  --accent-dim: #3ab8e0;
  --accent-glow: rgba(76,201,240,0.15);
  --ok: #4ade80;
  --amber: #fbbf24;
  --violet: #b48cf2;
  --rose: #ff6b8a;
  --red: #ef4444;
  --mono: "JetBrains Mono", ui-monospace, "Fira Code", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }

/* === Top bar === */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--line);
}
.topbar h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.topbar .status {
  font-size: 11px;
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.topbar .links {
  margin-left: auto;
  display: flex;
  gap: 12px;
  font-size: 12px;
}
.topbar .links a { color: var(--ink-dim); }
.topbar .links a:hover { color: var(--ink); }

/* === Main layout === */
.main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 0;
  min-height: calc(100vh - 50px);
}
.content {
  padding: 20px;
  overflow-y: auto;
}
.rail {
  background: var(--bg-elev);
  border-left: 1px solid var(--line);
  padding: 20px;
  overflow-y: auto;
}

/* === Timeline === */
.timeline {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}
.timeline-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.timeline-header .t-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
}
.timeline-header .t-range {
  font-size: 11px;
  color: var(--ink-mute);
  font-family: var(--mono);
}
.timeline-track {
  position: relative;
  height: 60px;
  background: var(--bg-elev-2);
  border-radius: 4px;
  overflow: hidden;
}
.timeline-bar {
  position: absolute;
  top: 0;
  bottom: 0;
  background: linear-gradient(90deg, var(--accent-glow), var(--accent));
  opacity: 0.6;
  border-radius: 2px;
}
.timeline-cursor {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  cursor: pointer;
}
.timeline-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 10px;
  color: var(--ink-mute);
  font-family: var(--mono);
}

/* === Model cards === */
.model-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.model-card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.model-card.loaded {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.model-card .mc-name {
  font-size: 13px;
  font-weight: 600;
  font-family: var(--mono);
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.model-card .mc-name.loaded { color: var(--accent); }
.model-card .mc-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--ink-dim);
  font-family: var(--mono);
}
.model-card .mc-actions {
  margin-top: 10px;
  display: flex;
  gap: 6px;
}
.model-card .mc-actions button {
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
  font-family: var(--mono);
}
.model-card .mc-actions button:hover { color: var(--ink); border-color: var(--line-hi); }
.model-card .mc-actions button:disabled { opacity: 0.4; cursor: default; }

/* === KV panel === */
.kv-panel {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 16px;
}
.kv-panel .kv-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  margin-bottom: 10px;
}
.kv-list {
  list-style: none;
  font-family: var(--mono);
  font-size: 11px;
  max-height: 160px;
  overflow-y: auto;
}
.kv-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
}
.kv-list li:last-child { border-bottom: none; }
.kv-list .kv-name { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv-list .kv-size { color: var(--ink-dim); font-size: 10px; }
.kv-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.kv-actions button {
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg-elev-2);
  color: var(--ink-dim);
  cursor: pointer;
  font-family: var(--mono);
}
.kv-actions button:hover { color: var(--ink); border-color: var(--line-hi); }
.kv-actions button:disabled { opacity: 0.4; cursor: default; }
.kv-actions button.danger { color: var(--rose); }
.kv-status {
  font-size: 10px;
  color: var(--ink-mute);
  margin-top: 6px;
  font-family: var(--mono);
}

/* === Rail === */
.rail-section {
  margin-bottom: 20px;
}
.rail-section .rs-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.rail-stat {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 12px;
  font-family: var(--mono);
  border-bottom: 1px solid var(--line);
}
.rail-stat:last-child { border-bottom: none; }
.rail-stat .rs-label { color: var(--ink-dim); }
.rail-stat .rs-value { color: var(--ink); }

/* === Responsive === */
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .rail { border-left: none; border-top: 1px solid var(--line); }
}
@media (max-width: 600px) {
  .model-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>LLM SERVE — ALT</h1>
  <span class="status" id="status">CONNECTING</span>
  <div class="links">
    <a href="/" target="_blank">Sidecar</a>
    <a href="http://localhost:3001/d/llm-serve" target="_blank">Grafana</a>
  </div>
</div>

<div class="main">
  <div class="content">
    <!-- Timeline (unique capability) -->
    <div class="timeline">
      <div class="timeline-header">
        <span class="t-title">Activity Timeline</span>
        <span class="t-range" id="timeline-range">— last 1h —</span>
      </div>
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-bar" id="timeline-bar" style="left:0%;width:100%;"></div>
        <div class="timeline-cursor" id="timeline-cursor" style="left:50%;"></div>
      </div>
      <div class="timeline-labels">
        <span id="tl-start">—</span>
        <span id="tl-end">—</span>
      </div>
    </div>

    <!-- Model grid -->
    <div class="model-grid" id="model-grid">
      <!-- Rendered by JS -->
    </div>
  </div>

  <div class="rail">
    <!-- KV panel -->
    <div class="kv-panel">
      <div class="kv-title">KV Cache</div>
      <ul class="kv-list" id="kv-list">
        <li><span class="kv-name" style="color:var(--ink-mute);">no snapshots</span></li>
      </ul>
      <div class="kv-actions" id="kv-actions">
        <button onclick="kvSave()" disabled>SAVE</button>
        <button onclick="kvRestore()" disabled>RESTORE</button>
        <button onclick="kvSwap()" disabled>SWAP</button>
        <button class="danger" onclick="kvErase()" disabled>ERASE</button>
        <button class="danger" onclick="kvPrune()" disabled>PRUNE</button>
      </div>
      <div class="kv-status" id="kv-status">—</div>
    </div>

    <!-- Stats rail -->
    <div class="rail-section">
      <div class="rs-title">Live Stats</div>
      <div id="stats-rail">
        <div class="rail-stat"><span class="rs-label">decode</span><span class="rs-value" id="stat-decode">—</span></div>
        <div class="rail-stat"><span class="rs-label">prompt</span><span class="rs-value" id="stat-prompt">—</span></div>
        <div class="rail-stat"><span class="rs-label">ctx tokens</span><span class="rs-value" id="stat-ctx">—</span></div>
        <div class="rail-stat"><span class="rs-label">requests</span><span class="rs-value" id="stat-reqs">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
let data = { model: null, snapshots: [], presets: [], others: [] };
let timelineData = [];

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
  return (bytes / 1073741824).toFixed(1) + " GB";
}

async function poll() {
  try {
    const [kvRes, rosterRes] = await Promise.all([
      fetch("/api/kv/snapshots").then(r => r.json()),
      fetch("/api/models/roster").then(r => r.json()),
    ]);
    data.model = kvRes.model;
    data.snapshots = kvRes.snapshots;
    data.presets = rosterRes.presets;
    data.others = rosterRes.others;
    document.getElementById("status").textContent = "LIVE";
    renderModelGrid();
    renderKV();
    fetchStats();
    updateTimeline();
  } catch (e) {
    document.getElementById("status").textContent = "ERROR";
  }
}

function renderModelGrid() {
  const el = document.getElementById("model-grid");
  let html = "";
  for (const p of data.presets) {
    const loaded = p.name === data.model;
    html += `<div class="model-card ${loaded ? "loaded" : ""}">
      <div class="mc-name ${loaded ? "loaded" : ""}">${escHtml(p.name)}</div>
      <div class="mc-stats">
        <span>${loaded ? "active" : "unloaded"}</span>
      </div>
      <div class="mc-actions">
        ${loaded ? "" : `<button onclick="loadModel('${escHtml(p.name)}')">LOAD</button>`}
      </div>
    </div>`;
  }
  for (const name of data.others) {
    html += `<div class="model-card">
      <div class="mc-name" style="color:var(--ink-mute);">${escHtml(name)}</div>
      <div class="mc-stats"><span>other</span></div>
    </div>`;
  }
  el.innerHTML = html;
}

function renderKV() {
  const list = document.getElementById("kv-list");
  const actions = document.getElementById("kv-actions");
  const hasModel = !!data.model;
  const snaps = data.snapshots;

  if (snaps.length === 0) {
    list.innerHTML = `<li><span class="kv-name" style="color:var(--ink-mute);">no snapshots</span></li>`;
  } else {
    list.innerHTML = snaps.map(s => `<li>
      <span class="kv-name">${escHtml(s.filename)}</span>
      <span class="kv-size">${fmtSize(s.size)}</span>
    </li>`).join("");
  }

  // Enable/disable buttons
  const btns = actions.querySelectorAll("button");
  btns.forEach(btn => {
    const label = btn.textContent;
    if (label === "SAVE" || label === "SWAP" || label === "ERASE") {
      btn.disabled = !hasModel;
    } else if (label === "RESTORE") {
      btn.disabled = !hasModel || snaps.length === 0;
    } else if (label === "PRUNE") {
      btn.disabled = snaps.length === 0;
    }
  });
}

async function fetchStats() {
  try {
    const [r1, r2, r3, r4] = await Promise.all([
      fetch("/api/prometheus/query?query=llamacpp:predicted_tokens_seconds").then(r => r.json()),
      fetch("/api/prometheus/query?query=llamacpp:prompt_tokens_seconds").then(r => r.json()),
      fetch("/api/prometheus/query?query=llamacpp:n_tokens_max").then(r => r.json()),
      fetch("/api/prometheus/query?query=llamacpp:requests_processing").then(r => r.json()),
    ]);
    document.getElementById("stat-decode").textContent = r1.data?.result?.[0]?.value?.[1] || "0";
    document.getElementById("stat-prompt").textContent = r2.data?.result?.[0]?.value?.[1] || "0";
    document.getElementById("stat-ctx").textContent = r3.data?.result?.[0]?.value?.[1] || "0";
    document.getElementById("stat-reqs").textContent = r4.data?.result?.[0]?.value?.[1] || "0";
  } catch {
    document.getElementById("stat-decode").textContent = "—";
  }
}

// === Timeline (unique capability) ===
function updateTimeline() {
  // Fetch range query for decode over last 1h via sidecar proxy
  fetch("/api/prometheus/query_range?query=llamacpp:predicted_tokens_seconds&start=" +
    (Date.now() / 1000 - 3600) + "&end=" + (Date.now() / 1000) + "&step=60")
    .then(r => r.json())
    .then(d => {
      const result = d.data?.result?.[0]?.values || [];
      if (result.length === 0) return;
      timelineData = result;
      const max = Math.max(...result.map(v => parseFloat(v[1])), 1);
      const now = Date.now() / 1000;
      const start = now - 3600;

      // Render bars
      const track = document.getElementById("timeline-track");
      let bars = "";
      for (const [ts, val] of result) {
        const pct = (parseFloat(val) / max) * 100;
        const left = ((ts - start) / 3600) * 100;
        bars += `<div class="timeline-bar" style="left:${left}%;width:1.6%;opacity:${0.2 + (pct / 100) * 0.6};"></div>`;
      }
      // Replace the default bar with individual bars
      const defaultBar = document.getElementById("timeline-bar");
      if (defaultBar) defaultBar.remove();
      track.insertAdjacentHTML("afterbegin", bars);

      // Labels
      document.getElementById("tl-start").textContent = new Date(start * 1000).toLocaleTimeString();
      document.getElementById("tl-end").textContent = new Date(now * 1000).toLocaleTimeString();
      document.getElementById("timeline-range").textContent = "last 1h";
    })
    .catch(() => {});
}

// === KV actions ===
async function kvAction(action, payload = {}) {
  const status = document.getElementById("kv-status");
  if (status) status.textContent = "…";
  try {
    const resp = await fetch(`/api/kv/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const d = await resp.json();
    if (status) status.textContent = d.error ? "error: " + d.error : JSON.stringify(d).slice(0, 80);
    poll();
  } catch (e) {
    if (status) status.textContent = "error: " + e.message;
  }
}

function kvSave() {
  const name = prompt("Snapshot name:", new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19));
  if (name !== null) kvAction("save", { filename: name });
}
function kvRestore() { if (confirm("Restore most recent?")) kvAction("restore"); }
function kvSwap() { if (confirm("Swap: save + erase?")) kvAction("swap"); }
function kvErase() { if (confirm("Erase slot?")) kvAction("erase"); }
function kvPrune() {
  const keep = prompt("Keep how many?", "3");
  if (keep !== null && confirm(`Prune to ${keep}?`)) kvAction("prune", { keep: parseInt(keep) || 3 });
}

async function loadModel(name) {
  try {
    const resp = await fetch("/api/models/load", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: name }),
    });
    const d = await resp.json();
    if (d.error) alert("Load failed: " + d.error);
    poll();
  } catch (e) { alert("Load failed: " + e.message); }
}

// === Init ===
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
